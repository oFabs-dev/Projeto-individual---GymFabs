<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculador IMC</title>
    <link rel="icon" href="../Index/img/favicon-32.png">
  </head>
  <body>
    <header>
      <div>
        <p>FERRAMENTA</p>
        <h1>Calculador <span>IMC</span></h1>
      </div>
      <a href="../Jump-goat-home/JumpGoat-home.html" class="voltar">← Voltar ao início</a>
    </header>

    <main>
      <div class="caixa_insert">

        <label for="ipt_peso">Peso (kg)</label>
        <input type="number" placeholder="Digite seu peso" id="ipt_peso" />

        <label for="ipt_altura">Altura (cm)</label>
        <input type="number" placeholder="Digite sua altura" id="ipt_altura" />

        <button onclick="calcular()">Calcular IMC →</button>
      </div>

      <div class="caixa_resultado">
        <div class="topo_resultado">
          <div>
            <span id="valor_imc">--</span>
          </div>
          <span id="selo_imc" class="selo">Sem cálculo</span>
        </div>

        <div class="faixas">
          <div class="faixa abaixo" id="faixa_abaixo">Abaixo do peso<b>&lt; 18.5</b></div>
          <div class="faixa normal" id="faixa_normal">Peso normal<b>18.5 – 24.9</b></div>
          <div class="faixa sobrepeso" id="faixa_sobrepeso">Sobrepeso<b>25 – 29.9</b></div>
          <div class="faixa obesidade" id="faixa_obesidade">Obesidade<b>≥ 30</b></div>
        </div>

        <div class="rodape">
          <div>
            <p id="comparacao">Calcule seu IMC para comparar</p>
            <p id="mensagem_salvar"></p>
          </div>
          <button class="salvar" onclick="salvar()">Atualizar ficha</button>
        </div>
      </div>
    </main>

    <section>
      <img class="aviso" src="img/aviso-atencao-maromba.png" alt="Atenção: o IMC não diferencia músculo de gordura" />
    </section>

    <script>
      let idUsuario = sessionStorage.getItem("ID_USUARIO");
      let imcAnterior = 0;
      let imcAtual = 0;
      let diaAnterior = "";

      let pesoAtual = 0;
      let alturaAtual = 0;

      // Ao abrir a página, carrega a ficha física do usuário (se existir)
      if (idUsuario != null) {
        fetch(`/imc/ficha/${idUsuario}`)
          .then(function (resposta) {
            return resposta.json();
          })
          .then(function (dados) {
            if (dados.length > 0) {
              let ficha = dados[0];

              // Preenche os campos com os dados salvos
              ipt_peso.value = Number(ficha.peso);
              ipt_altura.value = ficha.altura;

              // Mostra o resultado salvo, sem precisar clicar em calcular
              imcAnterior = Number(ficha.imc);
              imcAtual = imcAnterior;
              diaAnterior = `em ${ficha.dia}`;
              valor_imc.innerHTML = imcAtual.toFixed(2);
              mostrarClassificacao();

              comparacao.innerHTML = `Sua ficha: <b>${Number(ficha.peso)}kg · ${ficha.altura}cm</b> · atualizada ${diaAnterior}`;
            }
          });
      }

      function calcular() {
        let altura = Number(ipt_altura.value) / 100;
        let peso = Number(ipt_peso.value);
        let imc = peso / altura ** 2;

        if (peso > 0 && altura > 0) {
          valor_imc.innerHTML = imc.toFixed(2);
          imcAtual = Number(imc.toFixed(2));
          pesoAtual = peso;
          alturaAtual = Number(ipt_altura.value);
          mostrarClassificacao();
          comparar();
        } else {
          comparacao.innerHTML = "Preencha peso e altura";
        }
      }

      function mostrarClassificacao() {
        faixa_abaixo.classList.remove("ativa");
        faixa_normal.classList.remove("ativa");
        faixa_sobrepeso.classList.remove("ativa");
        faixa_obesidade.classList.remove("ativa");

        if (imcAtual < 18.5) {
          selo_imc.innerHTML = "Abaixo do peso";
          selo_imc.style.color = "#4cc9f0";
          faixa_abaixo.classList.add("ativa");
        } else if (imcAtual < 25) {
          selo_imc.innerHTML = "Peso normal";
          selo_imc.style.color = "#52d69a";
          faixa_normal.classList.add("ativa");
        } else if (imcAtual < 30) {
          selo_imc.innerHTML = "Sobrepeso";
          selo_imc.style.color = "#ffc857";
          faixa_sobrepeso.classList.add("ativa");
        } else {
          selo_imc.innerHTML = "Obesidade";
          selo_imc.style.color = "#ff5d73";
          faixa_obesidade.classList.add("ativa");
        }
      }

      function comparar() {
        let diferenca = Number((imcAtual - imcAnterior).toFixed(2));
        let ultimo = `Último: <b>${imcAnterior.toFixed(2)}</b>`;

        if (idUsuario == null) {
          comparacao.innerHTML = "Faça login para salvar e comparar";
        } else if (imcAnterior == 0) {
          comparacao.innerHTML = "Este é o seu primeiro registro";
        } else if (diferenca < 0) {
          comparacao.innerHTML = `${ultimo} · <b>▼ ${-diferenca}</b> você baixou`;
        } else if (diferenca > 0) {
          comparacao.innerHTML = `${ultimo} · <b>▲ ${diferenca}</b> você subiu`;
        } else {
          comparacao.innerHTML = `${ultimo} · mesmo IMC`;
        }
      }

      function salvar() {
        if (idUsuario == null) {
          mensagem_salvar.innerHTML = "Faça login para salvar";
        } else if (pesoAtual == 0) {
          mensagem_salvar.innerHTML = "Calcule seu IMC primeiro";
        } else {
          fetch("/imc/salvar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              idUsuarioServer: idUsuario,
              pesoServer: pesoAtual,
              alturaServer: alturaAtual,
              imcServer: imcAtual,
            }),
          }).then(function (resposta) {
            if (resposta.ok) {
              mensagem_salvar.innerHTML = "✓ Ficha atualizada!";
              imcAnterior = imcAtual;
              comparacao.innerHTML = `Sua ficha: <b>${pesoAtual}kg · ${alturaAtual}cm</b> · atualizada agora`;
            } else {
              mensagem_salvar.innerHTML = "Erro ao salvar a ficha";
            }
          });
        }
      }
    </script>
  </body>
</html>
